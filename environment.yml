name: case-reliability-fusion
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.4
  - scipy=1.17
  - pandas=2.3
  - pyarrow=24.0
  - scikit-learn=1.9
  - lightgbm=4.6
  - matplotlib=3.11
  - statsmodels=0.14
  - pyyaml=6.0
  - openpyxl
  - pytest
  - pip
  - pip:
      # Install the CUDA build matching your driver; the reported runs used
      # torch 2.11.0+cu128 on an NVIDIA RTX 3070 Ti Laptop GPU (CUDA 12.8).
      - torch==2.11.0
